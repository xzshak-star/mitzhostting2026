<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Mitz Hosting</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">
        <div class="logo-mark"><svg viewBox="0 0 24 24"><path d="M13 3L4 14h7l-1 7 9-11h-7l1-7z"/></svg></div>
        <span class="logo-text">Mitz<span class="accent">Hosting</span></span>
      </a>
      <div class="nav-links">
        <a href="/docs">Docs</a>
        <a href="/help">Help</a>
        <a href="/signup" class="btn-nav">Get Started</a>
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="subtitle">Login with your Telegram ID + password.</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="telegramId">Telegram User ID</label>
          <input type="text" id="telegramId" placeholder="8632939616" required inputmode="numeric" autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <p id="formError" class="form-error"></p>
        <button type="submit" class="btn-primary btn-full">Sign In</button>
      </form>
      <p class="auth-footer">Don't have an account? <a href="/signup">Create one</a></p>
    </div>
  </div>
  <script src="/js/main.js"></script>
</body>
</html>
